<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071b12">
  <meta name="description" content="Offline English spelling and reading assistant">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Spell & Speak">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233fe85f'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial,sans-serif' font-size='34' font-weight='700' fill='%23073e20'%3EAa%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <title>Offline Spelling</title>
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">Aa</span><span>Spell & Speak</span></div>
      <div class="topbar-right">
        <span id="offlineState" class="offline-state" role="status">Preparing offline app…</span>
        <button id="settingsButton" class="icon-button settings-button" type="button" aria-label="Open settings" title="Settings">⚙</button>
      </div>
    </header>

    <section class="display-panel" aria-label="Text display">
      <div id="displayText" class="display-text" dir="ltr">Start typing in English…</div>
      <button id="clearButton" class="clear-button" type="button" aria-label="Clear all text" title="Clear">×</button>
      <div id="feedback" class="feedback">Ready to type</div>
    </section>

    <section id="keyboard" class="keyboard" aria-label="English keyboard"></section>

    <nav class="actions" aria-label="Text actions">
      <button class="action action-space" type="button" data-action="space"><span class="action-icon" aria-hidden="true">␣</span><span>Space</span></button>
      <button class="action action-delete" type="button" data-action="delete"><span class="action-icon" aria-hidden="true">⌫</span><span>Delete</span></button>
      <button class="action action-clear" type="button" data-action="clear"><span class="action-icon" aria-hidden="true">♲</span><span>Clear</span></button>
      <button class="action action-speak" type="button" data-action="speak"><span class="action-icon" aria-hidden="true">🔊</span><span>Read Aloud</span></button>
    </nav>

    <div id="settingsBackdrop" class="settings-backdrop" hidden>
      <section class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings-heading">
          <h1 id="settingsTitle">Voice Settings</h1>
          <button id="closeSettings" class="icon-button close-settings" type="button" aria-label="Close settings">×</button>
        </div>
        <label class="setting-label" for="accentSelect">English accent</label>
        <select id="accentSelect" class="setting-control">
          <option value="en-GB">English (UK)</option>
          <option value="en-US">English (US)</option>
        </select>
        <p id="voiceStatus" class="voice-status">Checking local English voices…</p>
        <label class="setting-label" for="rateRange">Speech speed <output id="rateOutput">Normal</output></label>
        <input id="rateRange" class="range-control" type="range" min="0.55" max="1.1" step="0.05" value="0.8">
        <label class="setting-label" for="volumeRange">Speech volume <output id="volumeOutput">100%</output></label>
        <input id="volumeRange" class="range-control" type="range" min="0.2" max="1" step="0.05" value="1">
        <label class="toggle-row"><span>Speak each letter when tapped</span><input id="lettersToggle" type="checkbox" checked><span class="toggle-ui" aria-hidden="true"></span></label>
        <label class="toggle-row"><span>Automatically read a word after typing stops</span><input id="autoToggle" type="checkbox" checked><span class="toggle-ui" aria-hidden="true"></span></label>
        <label class="setting-label" for="delayRange">Auto-read delay <output id="delayOutput">1.5 sec</output></label>
        <input id="delayRange" class="range-control" type="range" min="0.8" max="3" step="0.1" value="1.5">
        <p class="settings-note">For offline speech, download an English voice in iPad Settings before going offline.</p>
      </section>
    </div>
  </main>
</body>
</html>
